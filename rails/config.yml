# LNM Gateway — NeMo Guardrails configuration.
# Loaded by nemoguardrails' real runtime (LLMRails) in rails/nemo_runtime.py;
# the flows in rails/rails.co execute on every request. The deterministic
# prefilter (rails/prefilter.py) runs in the gateway ahead of NeMo.

models: []

rails:
  input:
    flows:
      - prompt injection defense
      - jailbreak defense
  output:
    flows:
      - pii redaction
      - policy refusal

# Rail definitions. Each rail is a NeMo action (rails/nemo_runtime.py):
#   nemo_input_judge   -> rails/actions.py judge_input_injection (Ollama LLM)
#   nemo_redact_output -> rails/pii.py redact (deterministic regex)
#   nemo_policy_check  -> rails/actions.py judge_output_policy (Ollama LLM)
rails_config:
  prompt injection defense:
    strategy: nemo_input_rail_llm_judge
    description: Block instruction overrides, role spoofing, obfuscated payloads.
  jailbreak defense:
    strategy: nemo_input_rail_llm_judge
    description: Block DAN/mode-escalation/harmful-preface jailbreaks.
  pii redaction:
    strategy: nemo_output_rail_pii
    description: Redact emails, phones, SSNs, credit cards in model output.
  policy refusal:
    strategy: nemo_output_rail_llm_judge
    description: Refuse disallowed content (weapons, malware, wrongdoing).

# Deterministic thresholds — honored by the engine/monitors, no LLM involved.
thresholds:
  faithfulness_flag_below: 0.70
  faithfulness_sample_rate: 0.20
  semantic_cache_similarity: 0.95
  semantic_cache_ttl_seconds: 3600
